<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Doom — Three.js</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
html, body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100%; height: 100svh; height: 100vh; /* fallback */ }
@supports (height: 100svh) { html, body { height: 100svh; } }
body { display: flex; flex-direction: column; }
canvas { display: block; }
#game { flex: 1; position: relative; overflow: hidden; min-height: 0; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font: 24px monospace; background: #000; z-index: 60; }
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">Loading WAD...</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
